[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lead-scoring-cli"
version = "0.2.0"
description = "Transparent lead scoring with property-level seller research scoring and seller-to-buyer matching."
authors = [{name = "Mohammed Abdelshafy"}]
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
lead-score = "lead_scoring.engine:main"

[tool.setuptools.packages.find]
include = ["lead_scoring*"]
